html, body { width:100%; max-width:100%; }
.app { grid-template-columns:250px minmax(0,1fr); }

<div id="gasSyncNotice" aria-live="polite">Sincronización con Google Sheets</div><div class="app"><aside><div class="logo">AURA RESTO-BAR</div><button id="menuToggle" class="menu-toggle" type="button" aria-controls="nav" aria-expanded="false" onclick="toggleMenu()"><span class="hamb-icon" aria-hidden="true">☰</span><span>Menú</span><span class="menu-chevron" aria-hidden="true">▾</span></button><nav id="nav"></nav></aside><main id="m"></main></div>
<script>
if(typeof google==='undefined'||!google.script){document.getElementById('gasSyncNotice')?.remove()}
const K='nexo_business_v1';
const SERVER_STATE=null;
const SERVER_REVISION=0;
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(SERVER_STATE) S=SERVER_STATE;
let _serverRevision=Number(SERVER_REVISION)||0, _saveTimer=null, _saveInFlight=false, _pendingSnapshot=null, _localSaveVersion=0, _sentVersion=0, _syncConflict=false, _syncError='';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Búsqueda tolerante: sin tildes, mayúsculas ni signos. "aguila" encuentra "Águila". */
const nz=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
const fnd=(texto,consulta)=>{const t=nz(consulta).split(' ').filter(Boolean);if(!t.length)return true;const h=nz(texto);return t.every(x=>h.includes(x))};
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-CO');
const now=()=>new Date().toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'});
function nb(prods){const b={products:[],customers:[],sales:[],moves:[],expenses:[],debts:[],sessions:[],open:null};
 prods.forEach(([name,price,cost,min,qty])=>{const id=uid();b.products.push({id,name,price,cost,min});b.moves.push({id:uid(),pid:id,qty,type:'Inventario inicial',ref:'',at:now()})});return b}
if(!S){const a=uid(),c=uid();S={a,biz:[{id:a,name:'Perfumería Centro',type:'Comercio'},{id:c,name:'Restaurante Sabor',type:'Gastronomía'}],d:{}};
 S.d[a]=nb([['Perfume floral 50ml',20000,8000,5,30],['Colonia cítrica 100ml',35000,15000,5,4],['Crema corporal',12000,5000,5,20]]);
 S.d[c]=nb([['Hamburguesa',18000,7000,5,25],['Limonada',6000,1500,5,40],['Papas fritas',8000,2500,5,3]])}

 try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
 if(typeof google==='undefined'||!google.script||!google.script.run)return;

}
const B=()=>S.d[S.a];let tab='dash',cart=[],busy=false,note=null;
const stock=p=>B().moves.filter(m=>m.pid===p.id).reduce((s,m)=>s+m.qty,0);
const V=id=>document.getElementById(id)?.value;
const say=(t,e)=>{note={t,e}};
const tabs=[['dash','Dashboard'],['pos','Punto de venta'],['sales','Ventas'],['inv','Inventario'],['exp','Gastos'],['cash','Caja'],['debt','Deudas']];

function render(){
 document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';cart=[];note=null;render()">${l}</button>`).join('');
 const top=`<div class="top"><select onchange="S.a=this.value;cart=[];note=null;save();render()">${S.biz.map(x=>`<option value="${x.id}" ${x.id===S.a?'selected':''}>${esc(x.name)} · ${esc(x.type)}</option>`).join('')}</select>
 <input id="nn" placeholder="Nuevo negocio" size="14"><select id="nt"><option>Comercio</option><option>Gastronomía</option><option>Servicios</option></select><button class="b g" onclick="addBiz()">+ Negocio</button></div>`;
 const n=note?`<div class="msg ${note.e?'e':''}">${esc(note.t)}</div>`:'';
 document.getElementById('m').innerHTML=top+n+({dash,pos,sales,inv,exp,cash,debt}[tab])();note=null}
function addBiz(){const n=V('nn').trim();if(!n)return;const id=uid();S.biz.push({id,name:n,type:V('nt')});S.d[id]=nb([]);S.a=id;save();say('Negocio creado, con datos aislados.');render()}

function dash(){const b=B(),ok=b.sales.filter(s=>!s.void);
 const sv=ok.reduce((s,x)=>s+x.total,0),cg=ok.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.cost*i.qty,0),0),ex=b.expenses.reduce((s,x)=>s+x.amt,0);
 const un=b.products.reduce((s,p)=>s+stock(p),0),pc=b.debts.reduce((s,d)=>s+d.bal,0),low=b.products.filter(p=>stock(p)<=p.min);
 const c=(k,v,x='')=>`<div class="card"><div class="k">${k}</div><div class="v ${x}">${v}</div></div>`;
 return`<h2>Resumen del negocio</h2><div class="grid">${c('Ventas',fmt(sv))}${c('Gastos',fmt(ex))}${c('Utilidad estimada',fmt(sv-cg-ex),sv-cg-ex<0?'neg':'pos')}${c('Unidades en stock',un)}${c('Por cobrar',fmt(pc))}</div>

 <h3>Actividad reciente</h3>${ok.slice(-5).reverse().map(s=>`<div class="row"><span>Venta #${s.n}</span><b class="pos">+${fmt(s.total)}</b><span class="mut">${s.at}</span></div>`).join('')||'<p class="mut">Aún no hay ventas.</p>'}`}

function pos(){const b=B(),tot=cart.reduce((s,i)=>s+i.qty*i.price,0);
 return`<h2>Punto de venta</h2><div class="pg">${b.products.map(p=>`<button ${stock(p)<1?'disabled':''} onclick="add('${p.id}')"><b>${esc(p.name)}</b><br>${fmt(p.price)}<br><span class="k">Stock ${stock(p)}</span></button>`).join('')||'<p class="mut">Crea productos en Inventario.</p>'}</div>

 <p class="k">Si pagas menos del total, el saldo queda como cuenta por cobrar (requiere cliente).</p>

function add(id){const p=B().products.find(x=>x.id===id),i=cart.find(x=>x.pid===id);

 i?i.qty++:cart.push({pid:id,name:p.name,price:p.price,cost:p.cost,qty:1});render()}
function qty(id,d){const i=cart.find(x=>x.pid===id),p=B().products.find(x=>x.id===id);

 const n=b.sales.length+1,me=V('me'),at=now();

function sales(){const b=B();return`<h2>Historial de ventas</h2><div class="tw"><table><tr><th>#</th><th>Fecha</th><th>Total</th><th>Pago</th><th>Estado</th><th></th></tr>
 ${b.sales.slice().reverse().map(s=>`<tr><td>${s.n}</td><td>${s.at}</td><td>${fmt(s.total)}</td><td>${s.method}${s.credit?' + crédito':''}</td><td>${s.void?'<span class="neg">Anulada</span>':'Activa'}</td><td>${s.void?'':`<button class="b d" onclick="anular('${s.id}')">Anular</button>`}</td></tr>`).join('')}</table></div>
 <p class="k">Las ventas no se borran: la anulación genera movimientos inversos de inventario, deuda y caja.</p>`}
function anular(id){const b=B(),s=b.sales.find(x=>x.id===id);if(!s||s.void)return;s.void=true;
 s.items.forEach(i=>b.moves.push({id:uid(),pid:i.pid,qty:i.qty,type:'Anulación venta',ref:'#'+s.n,at:now()}));
 b.debts.filter(d=>d.sale===s.n).forEach(d=>d.bal=0);
 if(s.method==='Efectivo'&&b.open&&s.paid>0)b.open.mv.push({t:'Anulación #'+s.n,amt:-s.paid});
 save();say('Venta #'+s.n+' anulada con reverso completo.');render()}

function inv(){const b=B();return`<h2>Inventario</h2><div class="tw"><table><tr><th>Producto</th><th>Stock</th><th>Costo</th><th>Precio</th><th>Margen</th><th>Ajuste (+/−)</th></tr>
 ${b.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="${stock(p)<=p.min?'neg':''}">${stock(p)}</td><td>${fmt(p.cost)}</td><td>${fmt(p.price)}</td><td>${p.price?Math.round((p.price-p.cost)/p.price*100):0}%</td>
 <td><input id="a${p.id}" type="number" style="width:70px"> <button class="b g" onclick="adj('${p.id}')">Aplicar</button></td></tr>`).join('')}</table></div>
 <h3>Nuevo producto</h3><div class="row"><input id="pn" placeholder="Nombre"><input id="pp" type="number" placeholder="Precio" style="width:90px"><input id="pc" type="number" placeholder="Costo" style="width:90px"><input id="pm" type="number" placeholder="Mínimo" style="width:80px"><input id="pq" type="number" placeholder="Stock inicial" style="width:100px"><button class="b" onclick="addProd()">Agregar</button></div>
 <h3>Kardex (últimos movimientos)</h3><div class="tw"><table><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Ref.</th></tr>
 ${b.moves.slice(-12).reverse().map(m=>`<tr><td>${m.at}</td><td>${esc(b.products.find(p=>p.id===m.pid)?.name||'')}</td><td>${m.type}</td><td class="${m.qty<0?'neg':'pos'}">${m.qty>0?'+':''}${m.qty}</td><td>${m.ref}</td></tr>`).join('')}</table></div>
 <p class="k">El stock se calcula con movimientos; los errores se corrigen con un ajuste, nunca editando el historial.</p>`}
function adj(id){const q=+V('a'+id),p=B().products.find(x=>x.id===id);if(!q)return;
 if(stock(p)+q<0){say('El ajuste dejaría el stock en negativo.',1);return render()}
 B().moves.push({id:uid(),pid:id,qty:q,type:'Ajuste',ref:'',at:now()});save();render()}
function addProd(){const n=V('pn').trim();if(!n)return;const id=uid(),b=B();
 b.products.push({id,name:n,price:+V('pp')||0,cost:+V('pc')||0,min:+V('pm')||0});
 if(+V('pq')>0)b.moves.push({id:uid(),pid:id,qty:+V('pq'),type:'Inventario inicial',ref:'',at:now()});save();render()}

function exp(){const b=B();return`<h2>Gastos</h2><div class="row"><select id="ec"><option>Arriendo</option><option>Servicios</option><option>Nómina</option><option>Proveedores</option><option>Otros</option></select>
 <input id="ed" placeholder="Descripción"><input id="ea" type="number" placeholder="Valor" style="width:110px"><select id="em"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select><button class="b" onclick="addExp()">Registrar</button></div>
 <div class="tw"><table><tr><th>Fecha</th><th>Categoría</th><th>Detalle</th><th>Pago</th><th>Valor</th></tr>${b.expenses.slice().reverse().map(x=>`<tr><td>${x.at}</td><td>${x.cat}</td><td>${esc(x.desc)}</td><td>${x.method}</td><td>${fmt(x.amt)}</td></tr>`).join('')}</table></div>`}
function addExp(){const a=+V('ea');if(!(a>0))return;const b=B(),m=V('em');
 b.expenses.push({id:uid(),cat:V('ec'),desc:V('ed'),amt:a,method:m,at:now()});
 if(m==='Efectivo'&&b.open)b.open.mv.push({t:'Gasto: '+V('ed'),amt:-a});save();say('Gasto registrado.');render()}

function cash(){const b=B(),o=b.open;let h='<h2>Caja</h2>';
 if(!o)h+=`<div class="card"><p>No hay caja abierta.</p><div class="row"><input id="ci" type="number" placeholder="Saldo inicial"><button class="b" onclick="openCash()">Abrir caja</button></div></div>`;
 else{const ex=o.initial+o.mv.reduce((s,x)=>s+x.amt,0);
 h+=`<div class="card"><div class="k">Abierta desde ${o.at}</div><table><tr><td>Saldo inicial</td><td>${fmt(o.initial)}</td></tr>${o.mv.map(x=>`<tr><td>${esc(x.t)}</td><td class="${x.amt<0?'neg':'pos'}">${fmt(x.amt)}</td></tr>`).join('')}<tr><th>Efectivo esperado</th><th>${fmt(ex)}</th></tr></table>
 <div class="row"><input id="cc" type="number" placeholder="Efectivo contado"><button class="b" onclick="closeCash()">Cerrar caja (arqueo)</button></div></div>`}
 return h+`<h3>Historial de cierres</h3><div class="tw"><table><tr><th>Cierre</th><th>Esperado</th><th>Contado</th><th>Diferencia</th></tr>${b.sessions.slice().reverse().map(s=>`<tr><td>${s.closed}</td><td>${fmt(s.expected)}</td><td>${fmt(s.counted)}</td><td class="${s.diff<0?'neg':s.diff>0?'pos':''}">${fmt(s.diff)}</td></tr>`).join('')}</table></div>
 <p class="k">Esperado = saldo inicial + ventas y abonos en efectivo − gastos en efectivo.</p>`}
function openCash(){const v=+V('ci');if(V('ci')===''||v<0)return;B().open={at:now(),initial:v,mv:[]};save();say('Caja abierta.');render()}
function closeCash(){const b=B(),o=b.open,c=+V('cc');if(V('cc')==='')return;const ex=o.initial+o.mv.reduce((s,x)=>s+x.amt,0);
 b.sessions.push({opened:o.at,closed:now(),initial:o.initial,expected:ex,counted:c,diff:c-ex});b.open=null;save();say('Caja cerrada. Diferencia: '+fmt(c-ex));render()}

function debt(){const b=B(),nm=id=>b.customers.find(c=>c.id===id)?.name||'—';
 return`<h2>Clientes y deudas</h2><div class="row"><input id="cn" placeholder="Nuevo cliente"><button class="b g" onclick="addCust()">Agregar cliente</button></div>
 <div class="tw"><table><tr><th>Cliente</th><th>Venta</th><th>Saldo</th><th>Abono</th></tr>${b.debts.filter(d=>d.bal>0).map(d=>`<tr><td>${esc(nm(d.cust))}</td><td>#${d.sale}</td><td>${fmt(d.bal)}</td><td><input id="b${d.id}" type="number" style="width:90px"> <select id="bm${d.id}"><option>Efectivo</option><option>Transferencia</option></select> <button class="b" onclick="abono('${d.id}')">Abonar</button></td></tr>`).join('')||'<tr><td colspan="4" class="mut">Sin cuentas por cobrar.</td></tr>'}</table></div>`}
function addCust(){const n=V('cn').trim();if(!n)return;B().customers.push({id:uid(),name:n});save();render()}
function abono(id){const b=B(),d=b.debts.find(x=>x.id===id),a=+V('b'+id);if(!(a>0)||a>d.bal){say('Abono inválido: no puede superar el saldo.',1);return render()}
 d.bal-=a;d.pays.push({a,at:now()});if(V('bm'+id)==='Efectivo'&&b.open)b.open.mv.push({t:'Abono venta #'+d.sale,amt:a});save();say('Abono registrado.');render()}
render();
</script><script>
document.body.insertAdjacentHTML('beforeend','<div id="pr"></div><style id="ps"></style><div id="ts"></div>');
tabs.length=0;[['dash','📊 Dashboard'],['pos','🧾 Venta'],['mesas','🪑 Mesas'],['sales','📑 Ventas'],['inv','📦 Inventario'],['exp','💸 Gastos'],['cash','💵 Caja'],['debt','🤝 Deudas'],['tax','🏛️ Impuestos'],['neg','🏪 Negocios'],['rep','📤 Exportar']].forEach(t=>tabs.push(t));
const MS=b=>b.mesas||(b.mesas=Array.from({length:8},(_,i)=>'Mesa '+(i+1)).concat(['Barra','Para llevar']));
const TX=b=>b.taxes||(b.taxes=[]),act=b=>b.products.filter(p=>!p.del);
let mesa='',q='',iq='',tk=null,delc=null,delp=null,sc='uno',pw=80;
const go=t=>{tab=t;cart=[];note=null;render()};
const toast=t=>{const e=document.getElementById('ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};
const oblig=(b,base)=>TX(b).filter(t=>t.kind==='p'&&t.on).reduce((s,t)=>s+(t.mode==='%'?base*t.val/100:t.val),0);
const collected=ok=>{const c={};ok.forEach(s=>(s.taxes||[]).forEach(t=>c[t.name]=(c[t.name]||0)+t.amt));return c};
const calc=()=>{const sub=cart.reduce((s,i)=>s+i.qty*i.price,0),tx=TX(B()).filter(t=>t.on&&t.kind==='f').map(t=>({name:t.name,rate:t.val,amt:Math.round(sub*t.val/100)}));return{sub,tx,total:sub+tx.reduce((s,t)=>s+t.amt,0)}};
function pr(html,w,size){const e=document.getElementById('pr');e.style.width=w;e.innerHTML=html;document.getElementById('ps').textContent='@page{size:'+size+';margin:'+(w==='auto'?'12mm':'2mm')+'}';try{window.print()}catch(x){toast('Impresión bloqueada aquí: abre el enlace en una pestaña propia')}}
function ticket(s,cp){const b=B(),bz=S.biz.find(x=>x.id===S.a),cu=b.customers.find(c=>c.id===s.cust);
 return `<div class="tk">${cp?'<div class="c"><b>*** COPIA · CONTROL INTERNO ***</b></div>':''}<div class="c"><b>${esc(bz.name)}</b><br>Comprobante interno N° ${String(s.n).padStart(5,'0')}</div><div>${s.at}${s.mesa?'<br>'+esc(s.mesa):''}${cu?'<br>Cliente: '+esc(cu.name):''}</div><hr>${s.items.map(i=>`<div>${esc(i.name)}</div><div class="r">${i.qty} x ${fmt(i.price)} = ${fmt(i.qty*i.price)}</div>`).join('')}<hr><div class="r">Subtotal ${fmt(s.sub??s.total)}</div>${(s.taxes||[]).map(t=>`<div class="r">${esc(t.name)} ${t.rate}% ${fmt(t.amt)}</div>`).join('')}<div class="r"><b>TOTAL ${fmt(s.total)}</b></div><div>Pago: ${s.method}${s.credit?' · Crédito '+fmt(s.credit):''}</div>${cp?'<br><br>Firma: ____________________':'<div class="c">¡Gracias por su visita!</div>'}</div>`}
function printTk(){pr(ticket(tk,0)+'<div class="pb"></div>'+ticket(tk,1),pw+'mm',pw+'mm auto')}
function showTk(id){tk=B().sales.find(x=>x.id===id);tab='pos';cart=[];render()}

function render(){
 document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 const top=`<div class="top"><select onchange="S.a=this.value;cart=[];mesa='';tk=null;save();render()">${S.biz.map(x=>`<option value="${x.id}" ${x.id===S.a?'selected':''}>${esc(x.name)} · ${esc(x.type)}</option>`).join('')}</select><button class="b g" onclick="go('neg')">⚙ Negocios</button></div>`;
 const n=note?`<div class="msg ${note.e?'e':''}">${esc(note.t)}</div>`:'';
 const tp=tk&&tab==='pos'?`<div class="card"><div class="row"><b>🧾 Factura #${tk.n}</b><select onchange="pw=+this.value;render()"><option value="80" ${pw===80?'selected':''}>Térmica 80 mm</option><option value="58" ${pw===58?'selected':''}>Térmica 58 mm</option></select><button class="b" onclick="printTk()">🖨 Imprimir factura + copia</button><button class="b g" onclick="tk=null;render()">Cerrar</button></div><div class="prev">${ticket(tk,0)}</div><p class="k">Comprobante interno de control; no reemplaza la factura electrónica DIAN.</p></div>`:'';
 document.getElementById('m').innerHTML=top+n+tp+({dash,pos,mesas,sales,inv,exp,cash,debt,tax,neg,rep}[tab])();note=null}

function dash(){const b=B(),ok=b.sales.filter(s=>!s.void),sv=ok.reduce((s,x)=>s+(x.sub??x.total),0),cg=ok.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.cost*i.qty,0),0),ex=b.expenses.reduce((s,x)=>s+x.amt,0),ob=oblig(b,sv),col=Object.values(collected(ok)).reduce((a,c)=>a+c,0),net=sv-cg-ex-ob,pc=b.debts.reduce((s,d)=>s+d.bal,0),low=act(b).filter(p=>stock(p)<=p.min);
 const tp={};ok.forEach(s=>s.items.forEach(i=>tp[i.name]=(tp[i.name]||0)+i.qty));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?.[1]||1;
 const c=(k,v,g,x='')=>`<div class="card hov" onclick="go('${g}')"><div class="k">${k}</div><div class="v ${x}">${v}</div></div>`;
 return`<h2>${esc(S.biz.find(x=>x.id===S.a).name)}</h2><div class="grid">${c('Ventas netas',fmt(sv),'sales')}${c('Gastos',fmt(ex),'exp')}${c('Utilidad neta estimada',fmt(net),'rep',net<0?'neg':'pos')}${c('Impuestos por pagar',fmt(col+ob),'tax')}${c('Por cobrar',fmt(pc),'debt')}${c('Alertas de stock',low.length,'inv',low.length?'neg':'')}</div>
 <h3>Más vendidos</h3>${top.map(([n,u])=>`<div class="row"><span style="width:130px">${esc(n)}</span><div class="bw" style="flex:1"><div class="bar" style="width:${u/mx*100}%"></div></div><b>${u}</b></div>`).join('')||'<p class="mut">Aún sin ventas.</p>'}
 <h3>Stock bajo</h3>${low.map(p=>`<div class="card hov" style="margin-bottom:6px" onclick="go('inv')">${esc(p.name)}: <b class="neg">${stock(p)}</b> uds (mín. ${p.min})</div>`).join('')||'<p class="mut">Sin alertas.</p>'}`}

const pgrid=()=>act(B()).filter(p=>fnd(p.name,q)).map(p=>`<button ${stock(p)<1?'disabled':''} onclick="add('${p.id}')"><b>${esc(p.name)}</b><br>${fmt(p.price)}<br><span class="k">Stock ${stock(p)}</span></button>`).join('')||'<span class="mut">Sin productos.</span>';
function pickM(i){const m=MS(B())[i];mesa=mesa===m?'':m;render()}
function pos(){const b=B(),c=calc();
 return`<h2>Punto de venta</h2><div class="chips">${MS(b).map((m,i)=>`<button class="chip ${m===mesa?'on':''}" onclick="pickM(${i})">${esc(m)}</button>`).join('')}</div>
 <input placeholder="🔍 Buscar producto" value="${esc(q)}" oninput="q=this.value;document.getElementById('pgrid').innerHTML=pgrid()" style="width:100%;margin-bottom:8px"><div class="pg" id="pgrid">${pgrid()}</div>
 <h3>Cuenta ${mesa?'· '+esc(mesa):'(sin mesa)'}</h3><div class="card">${cart.map(i=>`<div class="row"><span style="flex:1">${esc(i.name)}</span><button class="b g" onclick="qty('${i.pid}',-1)">−</button>${i.qty}<button class="b g" onclick="qty('${i.pid}',1)">+</button><b>${fmt(i.qty*i.price)}</b></div>`).join('')||'<span class="mut">Vacío</span>'}
 <div class="row"><span class="mut">Subtotal</span><b>${fmt(c.sub)}</b></div>${c.tx.map(t=>`<div class="row"><span class="mut">${esc(t.name)} ${t.rate}%</span><b>${fmt(t.amt)}</b></div>`).join('')}<div class="v">Total ${fmt(c.total)}</div>
 <div class="row"><select id="cu"><option value="">Cliente (opcional)</option>${b.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><select id="me"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select><input id="pa" type="number" min="0" placeholder="Pagado ahora (vacío = total)"></div>
 <p class="k">Si pagas menos del total, el saldo queda a crédito (requiere cliente).</p><button class="b" ${cart.length?'':'disabled'} onclick="cobrar()">Cobrar</button></div>`}
function cobrar(){if(busy||!cart.length)return;busy=true;const b=B();
 try{for(const i of cart){const p=b.products.find(x=>x.id===i.pid);if(stock(p)<i.qty){say('Stock insuficiente: '+p.name,1);return}}
 const c=calc(),total=c.total,pv=V('pa'),paid=pv===''?total:Math.min(total,Math.max(0,+pv)),credit=total-paid,cu=V('cu');
 if(credit>0&&!cu){say('Para vender a crédito selecciona un cliente.',1);return}
 const n=b.sales.length+1,me=V('me'),at=now(),s={id:uid(),n,at,items:cart.map(i=>({...i})),sub:c.sub,taxes:c.tx,total,method:me,paid,credit,cust:cu,mesa,void:false};
 b.sales.push(s);cart.forEach(i=>b.moves.push({id:uid(),pid:i.pid,qty:-i.qty,type:'Venta',ref:'#'+n,at}));
 if(credit>0)b.debts.push({id:uid(),cust:cu,sale:n,bal:credit,total:credit,pays:[]});
 if(me==='Efectivo'&&b.open&&paid>0)b.open.mv.push({t:'Venta #'+n,amt:paid});
 cart=[];tk=s;mesa='';save();say('Venta #'+n+' registrada por '+fmt(total))}
 finally{busy=false;render()}}

function mesas(){const b=B(),ok=b.sales.filter(s=>!s.void);return`<h2>Mesas</h2><p class="k">Toca una mesa para abrir una venta en ella.</p><div class="grid">${MS(b).map((m,i)=>{const l=ok.filter(s=>s.mesa===m);return`<div class="card hov" onclick="tab='pos';cart=[];mesa=MS(B())[${i}];render()"><b>🪑 ${esc(m)}</b><div class="k">${l.length} ventas</div><div class="v">${fmt(l.reduce((s,x)=>s+x.total,0))}</div></div>`}).join('')}</div>`}
function sales(){const b=B();return`<h2>Ventas</h2><div class="tw"><table><tr><th>#</th><th>Fecha</th><th>Mesa</th><th>Total</th><th>Pago</th><th>Estado</th><th></th></tr>${b.sales.slice().reverse().map(s=>`<tr><td>${s.n}</td><td>${s.at}</td><td>${esc(s.mesa||'—')}</td><td>${fmt(s.total)}</td><td>${s.method}${s.credit?' + crédito':''}</td><td>${s.void?'<span class="neg">Anulada</span>':'Activa'}</td><td><button class="b g" onclick="showTk('${s.id}')">🖨 Factura</button> ${s.void?'':`<button class="b d" onclick="anular('${s.id}')">Anular</button>`}</td></tr>`).join('')}</table></div>`}

function itb(){const L=act(B()).filter(p=>fnd(p.name+' '+(p.cat||''),iq));const n=(p,k)=>`<td><input type="number" value="${p[k]}" onchange="ed('${p.id}','${k}',this.value)"></td>`;
 return`<table><tr><th>Producto</th><th>Categoría</th><th>Stock</th><th>Costo</th><th>Precio</th><th>Mín.</th><th>Valor</th><th></th></tr>${L.map(p=>{const s=stock(p);return`<tr><td><input value="${esc(p.name)}" onchange="ed('${p.id}','name',this.value)"></td><td><input value="${esc(p.cat||'')}" onchange="ed('${p.id}','cat',this.value)"></td><td class="${s<=p.min?'neg':''}"><button class="b g" onclick="st1('${p.id}',-1)">−</button> <input type="number" value="${s}" style="width:64px;min-width:0" onchange="setSt('${p.id}',this.value)"> <button class="b g" onclick="st1('${p.id}',1)">+</button></td>${n(p,'cost')}${n(p,'price')}${n(p,'min')}<td>${fmt(s*p.cost)}</td><td><button class="b d" onclick="delP('${p.id}')">${delp===p.id?'¿Seguro?':'🗑'}</button></td></tr>`}).join('')}</table>`}
function inv(){const b=B(),L=act(b);return`<h2>Inventario</h2><div class="grid"><div class="card"><div class="k">Referencias</div><div class="v">${L.length}</div></div><div class="card"><div class="k">Valor al costo</div><div class="v">${fmt(L.reduce((s,p)=>s+stock(p)*p.cost,0))}</div></div></div>
 <input placeholder="🔍 Buscar producto o categoría" value="${esc(iq)}" oninput="iq=this.value;document.getElementById('itb').innerHTML=itb()" style="width:100%;margin:10px 0"><div class="tw" id="itb">${itb()}</div>
 <h3>Nuevo producto</h3><div class="row"><input id="pn" placeholder="Nombre"><input id="pk" placeholder="Categoría"><input id="pp" type="number" placeholder="Precio" style="width:90px"><input id="pc" type="number" placeholder="Costo" style="width:90px"><input id="pm" type="number" placeholder="Mínimo" style="width:80px"><input id="pq" type="number" placeholder="Stock inicial" style="width:100px"><button class="b" onclick="addProd()">Agregar</button></div>
 <h3>Kardex</h3><div class="tw"><table><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Ref.</th></tr>${b.moves.slice(-12).reverse().map(m=>`<tr><td>${m.at}</td><td>${esc(b.products.find(p=>p.id===m.pid)?.name||'')}</td><td>${m.type}</td><td class="${m.qty<0?'neg':'pos'}">${m.qty>0?'+':''}${m.qty}</td><td>${m.ref}</td></tr>`).join('')}</table></div><p class="k">Editar stock registra un ajuste en el kardex; eliminar un producto conserva su historial.</p>`}
function ed(id,k,v){const p=B().products.find(x=>x.id===id);p[k]=['price','cost','min'].includes(k)?Math.max(0,+v||0):v;save();render()}

function st1(id,d){const p=B().products.find(x=>x.id===id);if(stock(p)+d<0)return;mv(id,d,'Ajuste');save();render()}
function delP(id){if(delp!==id){delp=id;return render()}B().products.find(x=>x.id===id).del=true;delp=null;save();say('Producto eliminado (historial conservado).');render()}
function addProd(){const n=V('pn').trim();if(!n)return;const id=uid(),b=B();b.products.push({id,name:n,cat:V('pk').trim(),price:+V('pp')||0,cost:+V('pc')||0,min:+V('pm')||0});if(+V('pq')>0)mv(id,+V('pq'),'Inventario inicial');save();say('Producto agregado.');render()}

function neg(){return`<h2>Negocios</h2>${S.biz.map(x=>`<div class="card row"><input value="${esc(x.name)}" onchange="x_('${x.id}','name',this.value)"><select onchange="x_('${x.id}','type',this.value)">${['Comercio','Gastronomía','Servicios'].map(t=>`<option ${t===x.type?'selected':''}>${t}</option>`).join('')}</select>${x.id===S.a?'<span class="chipx">Activo</span>':`<button class="b g" onclick="S.a='${x.id}';save();render()">Abrir</button>`}<button class="b d" onclick="dn('${x.id}')">${delc===x.id?'¿Borrar con todos sus datos?':'🗑 Eliminar'}</button></div>`).join('')}
 <h3>Nuevo negocio</h3><div class="row"><input id="nn" placeholder="Nombre"><select id="nt"><option>Gastronomía</option><option>Comercio</option><option>Servicios</option></select><button class="b" onclick="addBiz()">+ Crear</button></div>
 <h3>Mesas del negocio activo</h3><div class="row"><input id="nm" type="number" min="0" max="60" style="width:80px" value="${MS(B()).filter(m=>m.startsWith('Mesa ')).length}"><button class="b g" onclick="setM()">Aplicar</button><span class="k">(más Barra y Para llevar)</span></div>`}
function x_(id,k,v){S.biz.find(x=>x.id===id)[k]=v.trim()||'Negocio';save();render()}
function dn(id){if(S.biz.length<2){say('Debe quedar al menos un negocio.',1);return render()}if(delc!==id){delc=id;return render()}delete S.d[id];S.biz=S.biz.filter(x=>x.id!==id);if(S.a===id)S.a=S.biz[0].id;delc=null;cart=[];mesa='';save();say('Negocio eliminado.');render()}
function setM(){const n=Math.min(60,Math.max(0,+V('nm')||0));B().mesas=Array.from({length:n},(_,i)=>'Mesa '+(i+1)).concat(['Barra','Para llevar']);save();render()}

function tax(){const b=B(),T=TX(b),ok=b.sales.filter(s=>!s.void),base=ok.reduce((s,x)=>s+(x.sub??x.total),0),col=collected(ok);
 return`<h2>Impuestos y obligaciones</h2><p class="k">“En factura” se suma al total de cada venta. “Del período” se calcula sobre ventas netas (%) o como valor fijo. Confirma tarifas con tu contador.</p>
 <div class="row"><button class="b g" onclick="addT('Impoconsumo','f',8)">+ Impoconsumo 8%</button><button class="b g" onclick="addT('IVA','f',19)">+ IVA 19%</button><button class="b g" onclick="addT('Propina voluntaria','f',10)">+ Propina 10%</button><button class="b g" onclick="addT('ICA','p',0)">+ ICA</button><button class="b g" onclick="addT('Renta / anticipo','p',0)">+ Renta</button></div>
 <div class="tw"><table><tr><th>Activo</th><th>Nombre</th><th>Tipo</th><th>Modo</th><th>Valor</th><th></th></tr>${T.map(t=>`<tr><td><input type="checkbox" ${t.on?'checked':''} onchange="ut('${t.id}','on',this.checked)" style="width:auto"></td><td><input value="${esc(t.name)}" onchange="ut('${t.id}','name',this.value)"></td><td>${t.kind==='f'?'En factura':'Del período'}</td><td>${t.kind==='f'?'%':`<select onchange="ut('${t.id}','mode',this.value)"><option ${t.mode==='%'?'selected':''}>%</option><option ${t.mode==='$'?'selected':''}>$</option></select>`}</td><td><input type="number" value="${t.val}" onchange="ut('${t.id}','val',this.value)"></td><td><button class="b d" onclick="dt('${t.id}')">🗑</button></td></tr>`).join('')||'<tr><td colspan="6" class="mut">Sin impuestos configurados.</td></tr>'}</table></div>
 <h3>Agregar personalizado</h3><div class="row"><input id="xn" placeholder="Nombre (ej. Seguridad social)"><select id="xk"><option value="f">En factura</option><option value="p">Del período</option></select><select id="xm"><option>%</option><option>$</option></select><input id="xv" type="number" placeholder="Valor" style="width:100px"><button class="b" onclick="addT(V('xn'),V('xk'),+V('xv')||0,V('xm'))">Agregar</button></div>
 <h3>Resumen</h3><div class="tw"><table><tr><th>Concepto</th><th>Tipo</th><th>Monto</th></tr>${Object.entries(col).map(([k,v])=>`<tr><td>${esc(k)}</td><td>Recaudado en facturas</td><td>${fmt(v)}</td></tr>`).join('')}${T.filter(t=>t.kind==='p'&&t.on).map(t=>`<tr><td>${esc(t.name)}</td><td>Obligación del período</td><td>${fmt(t.mode==='%'?base*t.val/100:t.val)}</td></tr>`).join('')}</table></div>`}
function addT(n,k,v,m){if(!n||!n.trim())return;TX(B()).push({id:uid(),name:n.trim(),kind:k,mode:k==='f'?'%':(m||'%'),val:v,on:true});save();render()}
function ut(id,k,v){const t=TX(B()).find(x=>x.id===id);t[k]=k==='val'?+v||0:v;save();render()}
function dt(id){const b=B();b.taxes=TX(b).filter(x=>x.id!==id);save();render()}

function secs(b,nm){const ok=b.sales.filter(s=>!s.void),sb=x=>x.sub??x.total,st=p=>b.moves.filter(m=>m.pid===p.id).reduce((s,m)=>s+m.qty,0),sv=ok.reduce((s,x)=>s+sb(x),0),cg=ok.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.cost*i.qty,0),0),ex=b.expenses.reduce((s,x)=>s+x.amt,0),ob=oblig(b,sv),col=collected(ok),ct=Object.values(col).reduce((a,c)=>a+c,0);
 const grp=(a,kf,vf)=>{const m={};a.forEach(x=>{const k=kf(x);m[k]=(m[k]||0)+vf(x)});return Object.entries(m).map(([k,v])=>[k,fmt(v)])},pq={};ok.forEach(s=>s.items.forEach(i=>{const r=pq[i.name]||(pq[i.name]=[0,0]);r[0]+=i.qty;r[1]+=i.qty*i.price}));
 return[[nm+' · Resumen',['Indicador','Valor'],[['Ventas netas',fmt(sv)],['N° de ventas',ok.length],['Ticket promedio',fmt(ok.length?sv/ok.length:0)],['Costo de mercancía',fmt(cg)],['Gastos',fmt(ex)],['Utilidad antes de obligaciones',fmt(sv-cg-ex)],['Obligaciones del período',fmt(ob)],['Utilidad neta estimada',fmt(sv-cg-ex-ob)],['Impuestos recaudados en facturas',fmt(ct)],['Por cobrar',fmt(b.debts.reduce((s,d)=>s+d.bal,0))]]],
 ['Ventas por método',['Método','Total'],grp(ok,s=>s.method,s=>s.total)],['Ventas por mesa',['Mesa','Total'],grp(ok,s=>s.mesa||'Sin mesa',s=>s.total)],
 ['Productos más vendidos',['Producto','Uds','Ingreso'],Object.entries(pq).sort((a,b)=>b[1][0]-a[1][0]).slice(0,10).map(([k,v])=>[k,v[0],fmt(v[1])])],
 ['Inventario',['Producto','Stock','Costo','Precio','Valor'],act(b).map(p=>[p.name,st(p),fmt(p.cost),fmt(p.price),fmt(st(p)*p.cost)])],
 ['Gastos por categoría',['Categoría','Total'],grp(b.expenses,x=>x.cat,x=>x.amt)],
 ['Impuestos y obligaciones',['Concepto','Tipo','Monto'],[...Object.entries(col).map(([k,v])=>[k,'En factura',fmt(v)]),...TX(b).filter(t=>t.kind==='p'&&t.on).map(t=>[t.name,'Del período',fmt(t.mode==='%'?sv*t.val/100:t.val)])]],
 ['Cuentas por cobrar',['Cliente','Venta','Saldo'],b.debts.filter(d=>d.bal>0).map(d=>[b.customers.find(c=>c.id===d.cust)?.name||'—','#'+d.sale,fmt(d.bal)])],
 ['Cierres de caja',['Cierre','Esperado','Contado','Diferencia'],b.sessions.map(s=>[s.closed,fmt(s.expected),fmt(s.counted),fmt(s.diff)])]]}
const allS=()=>S.biz.filter(x=>sc==='todos'||x.id===S.a).flatMap(x=>secs(S.d[x.id],x.name));
const toMD=a=>'# Reporte AURA Resto-Bar\n_Generado: '+now()+'_\n\n'+a.map(([h,hd,r])=>`## ${h}\n\n| ${hd.join(' | ')} |\n|${hd.map(()=>'---').join('|')}|\n${(r.length?r:[hd.map(()=>'—')]).map(x=>'| '+x.join(' | ')+' |').join('\n')}\n`).join('\n');
const toH=a=>a.map(([h,hd,r])=>`<h2>${esc(h)}</h2><div class="tw"><table><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`).join('');
function rep(){const a=allS();return`<h2>Exportar para análisis</h2><div class="row"><select onchange="sc=this.value;render()"><option value="uno" ${sc==='uno'?'selected':''}>Solo este negocio</option><option value="todos" ${sc==='todos'?'selected':''}>Todos (consolidado)</option></select><button class="b" onclick="pdf()">🖨 Imprimir / Guardar como PDF</button><button class="b g" onclick="cp()">📋 Copiar Markdown</button></div>
 <p class="k">Para PDF elige “Guardar como PDF” en el diálogo de impresión. El Markdown se copia para pegarlo en un archivo .md.</p><textarea id="mdo" readonly style="width:100%;height:220px;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px">${esc(toMD(a))}</textarea><h3>Vista previa</h3>${toH(a)}`}
function cp(){const t=document.getElementById('mdo');t.select();let ok=0;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Markdown copiado ✔':'Selecciona el texto y copia con Ctrl+C')}
function pdf(){pr('<div class="rp"><h1 style="font-size:18px">Reporte AURA Resto-Bar</h1><p>'+now()+'</p>'+toH(allS())+'</div>','auto','A4')}
render();
</script><script>
let role=null,who='',ask=null,lr='o',fl=0,lk=0;
const TO=[...tabs,['sec','🔐 Seguridad']],TM=[['pos','🧾 Venta'],['inv','📦 Inventario']];
const hx=async s=>{try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('aura|'+s));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p|'+s}};
async function setup(){const a=V('s1'),m=V('s2');if(a.length<4||m.length<4||a===m){say('Cada PIN debe tener mínimo 4 dígitos y ser distintos.',1);return render()}S.sec={o:await hx(a),m:await hx(m)};save();say('PIN guardados. Ingresa con tu rol.');render()}
async function login(){if(Date.now()<lk){say('Demasiados intentos. Espera 30 segundos.',1);return render()}const h=await hx(V('lp')),nm=(V('ln')||'').trim();
 if(h!==S.sec[lr]){if(++fl>=5){lk=Date.now()+30000;fl=0}say('PIN incorrecto.',1);return render()}fl=0;role=lr==='o'?'owner':'mesero';who=lr==='o'?'Dueño':(nm||'Mesero');tab=role==='owner'?'dash':'pos';cart=[];render()}
function logout(){role=null;tk=null;ask=null;cart=[];mesa='';render()}
async function chg(){const a=V('n1'),m=V('n2');if((a&&a.length<4)||(m&&m.length<4)){say('Mínimo 4 dígitos.',1);return render()}const o=a?await hx(a):S.sec.o,e=m?await hx(m):S.sec.m;if(o===e){say('Los PIN deben ser distintos.',1);return render()}S.sec={o,m:e};save();say('PIN actualizados.');render()}
function loginUI(){if(!S.sec)return`<div class="card lg"><h2>🔐 Configura el acceso</h2><p>Crea un PIN (mín. 4 dígitos) para cada rol.</p><label>PIN del dueño<br><input id="s1" type="password" inputmode="numeric" autocomplete="new-password" style="width:100%"></label><br><br><label>PIN de meseros<br><input id="s2" type="password" inputmode="numeric" autocomplete="new-password" style="width:100%"></label><br><br><button class="b big" style="width:100%" onclick="setup()">Guardar y continuar</button></div>`;
 return`<div class="card lg"><h2>🍽️ AURA Resto-Bar</h2>${S.biz.length?'':''}<div class="chips"><button class="chip ${lr==='o'?'on':''}" onclick="lr='o';render()">👑 Dueño</button><button class="chip ${lr==='m'?'on':''}" onclick="lr='m';render()">🍽️ Mesero</button></div>${lr==='m'?'<label>Tu nombre<br><input id="ln" style="width:100%" placeholder="Para registrar tus ventas"></label><br><br>':''}<label>PIN<br><input id="lp" type="password" inputmode="numeric" autocomplete="off" style="width:100%" onkeydown="if(event.key==='Enter')login()"></label><br><br><button class="b big" style="width:100%" onclick="login()">Entrar</button></div>`}

const _tkt=ticket;ticket=(s,cp,re)=>{let h=_tkt(s,cp);if(s.by)h=h.replace('<hr>','<br>Atendió: '+esc(s.by)+'<hr>');return re?h.replace('<div class="tk">','<div class="tk"><div class="c"><b>*** REIMPRESIÓN ***</b></div>'):h};
const _cob=cobrar;cobrar=function(){const b=B(),n0=b.sales.length;_cob();if(b.sales.length>n0){const s=b.sales[b.sales.length-1];s.by=who;s.log=[];ask=s;save();render()}};
function printTk(){const s=ask||tk;if(!s)return;const re=(s.log||[]).length>0;(s.log=s.log||[]).push({at:now(),by:who,t:re?'Reimpresión':'Impresión'});tk=s;ask=null;save();pr(ticket(s,0,re)+'<div class="pb"></div>'+ticket(s,1,re),pw+'mm',pw+'mm auto');render()}
function mesas(){const b=B(),ok=b.sales.filter(s=>!s.void);return`<h2>Mesas</h2><div class="row"><input id="mn" placeholder="Nombre de la nueva mesa (ej. Terraza 1)" style="flex:1;min-width:200px"><button class="b big" onclick="addMesa()">+ Agregar mesa</button></div><p class="k">Toca una mesa para abrir una venta. Con ✕ la quitas (el historial de ventas se conserva).</p><div class="grid">${MS(b).map((m,i)=>{const l=ok.filter(s=>s.mesa===m);return`<div class="card hov" onclick="tab='pos';cart=[];mesa=MS(B())[${i}];render()"><div class="row" style="margin:0"><b>🪑 ${esc(m)}</b><button class="b d" style="margin-left:auto;min-height:36px;padding:2px 10px" aria-label="Quitar mesa" onclick="event.stopPropagation();delMesa(${i})">✕</button></div><div class="k">${l.length} ventas</div><div class="v">${fmt(l.reduce((s,x)=>s+x.total,0))}</div></div>`}).join('')}</div>`}
function addMesa(){const n=V('mn').trim(),b=B();if(!n)return;if(MS(b).includes(n)){say('Esa mesa ya existe.',1);return render()}b.mesas.push(n);save();render()}
function delMesa(i){const b=B();b.mesas.splice(i,1);mesa='';save();render()}
const _neg=neg;neg=()=>{const h=_neg(),i=h.indexOf('<h3>Mesas del negocio activo');return i<0?h:h.slice(0,i)};
function sales(){const b=B();return`<h2>Ventas</h2><div class="tw"><table><tr><th>#</th><th>Fecha</th><th>Atendió</th><th>Mesa</th><th>Total</th><th>Pago</th><th>Impr.</th><th>Estado</th><th></th></tr>${b.sales.slice().reverse().map(s=>`<tr><td>${s.n}</td><td>${s.at}</td><td>${esc(s.by||'—')}</td><td>${esc(s.mesa||'—')}</td><td>${fmt(s.total)}</td><td>${s.method}${s.credit?' + crédito':''}</td><td>${(s.log||[]).length}</td><td>${s.void?'<span class="neg">Anulada</span>':'Activa'}</td><td><button class="b g" onclick="showTk('${s.id}')">🖨 Factura</button> ${s.void?'':`<button class="b d" onclick="anular('${s.id}')">Anular</button>`}</td></tr>`).join('')}</table></div>`}
const roT=()=>{const L=act(B()).filter(p=>fnd(p.name+' '+(p.cat||''),iq));return`<table><tr><th>Producto</th><th>Categoría</th><th>Disponible</th><th>Precio</th></tr>${L.map(p=>{const s=stock(p);return`<tr><td>${esc(p.name)}</td><td>${esc(p.cat||'—')}</td><td class="${s<=p.min?'neg':'pos'}"><b>${s}</b>${s<=p.min?' · bajo':''}</td><td>${fmt(p.price)}</td></tr>`}).join('')}</table>`};
function invRO(){return`<h2>Inventario disponible</h2><input placeholder="🔍 Buscar producto" value="${esc(iq)}" oninput="iq=this.value;document.getElementById('itb').innerHTML=roT()" style="width:100%;margin-bottom:10px"><div class="tw" id="itb">${roT()}</div><p class="k">Solo consulta.</p>`}
function sec(){const L=S.biz.flatMap(x=>S.d[x.id].sales.flatMap(s=>(s.log||[]).map(l=>({...l,n:s.n,bz:x.name})))).slice(-12).reverse();return`<h2>Seguridad y accesos</h2><p><b>Dueño</b>: ve y edita todo. <b>Mesero</b>: solo consulta el inventario disponible (sin costos) y registra ventas.</p><div class="card"><h3 style="margin-top:0">Cambiar PIN</h3><div class="row"><input id="n1" type="password" inputmode="numeric" placeholder="Nuevo PIN del dueño"><input id="n2" type="password" inputmode="numeric" placeholder="Nuevo PIN de meseros"><button class="b" onclick="chg()">Guardar</button></div><p class="k">Déjalo vacío si no quieres cambiarlo.</p></div><h3>Registro de impresiones</h3><div class="tw"><table><tr><th>Fecha</th><th>Negocio</th><th>Venta</th><th>Tipo</th><th>Usuario</th></tr>${L.map(l=>`<tr><td>${l.at}</td><td>${esc(l.bz)}</td><td>#${l.n}</td><td class="${l.t==='Reimpresión'?'neg':''}">${l.t}</td><td>${esc(l.by)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Sin impresiones.</td></tr>'}</table></div><p class="k">Nota: el acceso por PIN se guarda en este navegador. Protege el uso diario, pero no sustituye un sistema con servidor si alguien tiene acceso técnico al dispositivo.</p>`}

function render(){const nv=document.getElementById('nav'),ap=document.querySelector('aside');ap.style.display=role?'':'none';document.querySelector('.app').style.gridTemplateColumns=role?'':'1fr';
 if(!role){const n=note?`<div class="msg ${note.e?'e':''}">${esc(note.t)}</div>`:'';nv.innerHTML='';document.getElementById('m').innerHTML=n+loginUI();note=null;return}
 const T=role==='owner'?TO:TM,ids=T.map(t=>t[0]);if(!ids.includes(tab))tab=ids[0];
 nv.innerHTML=T.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 const bz=S.biz.find(x=>x.id===S.a),top=`<div class="top">${role==='owner'?`<select aria-label="Negocio activo" onchange="S.a=this.value;cart=[];mesa='';tk=null;save();render()">${S.biz.map(x=>`<option value="${x.id}" ${x.id===S.a?'selected':''}>${esc(x.name)} · ${esc(x.type)}</option>`).join('')}</select><button class="b g" onclick="go('neg')">⚙ Negocios</button>`:`<b style="font-size:1.15rem">🏪 ${esc(bz.name)}</b>`}<span class="chipx" style="margin-left:auto">${role==='owner'?'👑 Dueño':'🍽️ '+esc(who)}</span><button class="b g" onclick="logout()">Salir</button></div>`;
 const n=note?`<div class="msg ${note.e?'e':''}">${esc(note.t)}</div>`:'';
 const tp=tk&&tab==='pos'?`<div class="card"><div class="row"><b>🧾 Factura #${tk.n}</b><select aria-label="Ancho de papel" onchange="pw=+this.value;render()"><option value="80" ${pw===80?'selected':''}>Térmica 80 mm</option><option value="58" ${pw===58?'selected':''}>Térmica 58 mm</option></select><button class="b" onclick="ask=tk;render()">🖨 ${(tk.log||[]).length?'Volver a imprimir':'Imprimir factura'}</button><button class="b g" onclick="tk=null;render()">Cerrar</button></div><div class="prev">${ticket(tk,0)}</div><p class="k">Comprobante interno de control; no reemplaza la factura electrónica DIAN.</p></div>`:'';

 const M={dash,pos,mesas,sales,inv,exp,cash,debt,tax,neg,rep,sec};
 document.getElementById('m').innerHTML=top+n+tp+(role==='owner'?M[tab]():(tab==='inv'?invRO():pos()))+md;note=null}
render();
</script><script>

const cats_=()=>[...new Set(act(B()).map(p=>p.cat).filter(Boolean))];
/* Paleta por categoría: tonos desaturados y estables (misma categoría = mismo color). */
const CAT_RULES=[
 [/sin alcohol|mocktail/i,152],

async function addStaff(){const n=V('sn').trim(),p=V('sp');if(!n||p.length<4){say('Escribe nombre y un PIN de mínimo 4 dígitos.',1);return render()}const h=await hx(p);if(h===S.sec.o||ST().some(x=>x.pin===h)){say('Ese PIN ya está en uso.',1);return render()}ST().push({id:uid(),name:n,pin:h});save();say('Mesero agregado.');render()}
async function pinStaff(id){const p=V('p'+id);if(p.length<4){say('Mínimo 4 dígitos.',1);return render()}const h=await hx(p);if(h===S.sec.o||ST().some(x=>x.pin===h)){say('Ese PIN ya está en uso.',1);return render()}ST().find(x=>x.id===id).pin=h;save();say('PIN actualizado.');render()}
function delStaff(id){S.staff=ST().filter(x=>x.id!==id);save();render()}
function loginUI(){const c=S.cfg;if(!S.sec)return`<div class="card lg"><h2>🔐 Crea tu PIN de dueño</h2><p>Mínimo 4 dígitos. Después agregas a tus meseros con su propio PIN en Seguridad.</p><label>PIN del dueño<br><input id="s1" type="password" inputmode="numeric" autocomplete="new-password" style="width:100%"></label><br><br><button class="b big" style="width:100%" onclick="setup()">Guardar y continuar</button></div>`;
 const bg=c.lbgImg?`background:url(${c.lbgImg}) center/cover`:c.lbg?`background:${c.lbg}`:'';
 return`<div class="lgw" style="${bg}"><div class="card lg">${c.logo?`<img class="lgi" src="${c.logo}" alt="">`:''}<h2 style="text-align:center">${esc(c.lt||c.app)}</h2>${c.lm?`<p class="k" style="text-align:center">${esc(c.lm)}</p>`:''}<label>Ingresa tu PIN<br><input id="lp" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font-size:1.4rem;text-align:center;letter-spacing:.3em" onkeydown="if(event.key==='Enter')login()"></label><br><br><button class="b big" style="width:100%" onclick="login()">Entrar</button></div></div>`}
function sec(){const L=S.biz.flatMap(x=>S.d[x.id].sales.flatMap(s=>(s.log||[]).map(l=>({...l,n:s.n,bz:x.name})))).slice(-12).reverse();return`<h2>Seguridad y accesos</h2><div class="card"><h3 style="margin-top:0">PIN del dueño</h3><div class="row"><input id="n1" type="password" inputmode="numeric" placeholder="Nuevo PIN"><button class="b" onclick="chg()">Cambiar</button></div></div><h3>Meseros</h3><p class="k">Cada mesero entra solo con su PIN; el sistema ya sabe quién es. Puede ver el inventario, tomar pedidos y cobrar.</p><div class="row"><input id="sn" placeholder="Nombre"><input id="sp" type="password" inputmode="numeric" placeholder="PIN (mín. 4)"><button class="b" onclick="addStaff()">+ Agregar</button></div>${ST().map(x=>`<div class="card row"><b style="flex:1">${esc(x.name)}</b><input id="p${x.id}" type="password" inputmode="numeric" placeholder="Nuevo PIN" style="width:140px"><button class="b g" onclick="pinStaff('${x.id}')">Cambiar PIN</button><button class="b d" onclick="delStaff('${x.id}')">Quitar</button></div>`).join('')||'<p class="mut">Aún no hay meseros.</p>'}<h3>Registro de impresiones</h3><div class="tw"><table><tr><th>Fecha</th><th>Negocio</th><th>Venta</th><th>Tipo</th><th>Usuario</th></tr>${L.map(l=>`<tr><td>${l.at}</td><td>${esc(l.bz)}</td><td>#${l.n}</td><td class="${l.t==='Reimpresión'?'neg':''}">${l.t}</td><td>${esc(l.by)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Sin impresiones.</td></tr>'}</table></div><p class="k">Los PIN se guardan cifrados en este navegador; protegen el uso diario pero no sustituyen un servidor.</p>`}

function cfg(){const c=S.cfg,ci=(k,l,d)=>`<label class="fld">${l}<input type="color" value="${c[k]||d}" onchange="cf('${k}',this.value)"></label>`,ti=(k,l,ph)=>`<label class="fld">${l}<input value="${esc(c[k]||'')}" placeholder="${ph||''}" onchange="cf('${k}',this.value)"></label>`,up=(k,t)=>`<div class="row">${c[k]?`<img class="lgi" style="margin:0;max-height:60px" src="${c[k]}" alt="">`:'<span class="mut">Sin imagen</span>'}<label class="b g up">📷 ${t}<input type="file" accept="image/*" hidden onchange="logoSet('${k}',this.files[0])"></label>${c[k]?`<button class="b d" onclick="cf('${k}','')">Quitar</button>`:''}</div>`;
 return`<h2>⚙️ Configuración</h2><div class="card"><h3 style="margin-top:0">🎨 Marca y apariencia</h3><div class="cc">${ti('app','Nombre de la app')}${ci('ac','Color principal','#0f766e')}${ci('bg','Color de fondo','#f6f7f9')}${ci('card','Color de tarjetas','#ffffff')}<label class="fld">Tema<select onchange="cf('theme',this.value)"><option value="auto" ${c.theme==='auto'?'selected':''}>Automático</option><option value="light" ${c.theme==='light'?'selected':''}>Claro</option><option value="dark" ${c.theme==='dark'?'selected':''}>Oscuro</option></select></label><label class="fld">Tamaño de letra<select onchange="cf('fs',this.value)">${[[16,'Normal'],[17,'Grande'],[19,'Más grande'],[21,'Extra grande']].map(([v,l])=>`<option value="${v}" ${c.fs===v?'selected':''}>${l}</option>`).join('')}</select></label></div><h3>Logotipo</h3>${up('logo','Subir logo')}<div class="row"><button class="b g" onclick="cfReset()">Restablecer colores y tamaño</button></div><p class="k">Si cambias fondo o tarjetas, usa colores acordes al tema (claros con tema claro, oscuros con oscuro) para que el texto se lea bien.</p></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-top:0">🔐 Pantalla de inicio de sesión</h3><div class="cc">${ti('lt','Título',c.app)}${ti('lm','Mensaje de bienvenida','Ej. Bienvenido, ingresa tu PIN')}${ci('lbg','Color de fondo','#0f766e')}</div><h3>Imagen de fondo</h3>${up('lbgImg','Subir imagen')}<div class="row"><button class="b g" onclick="cf('lbg','')">Quitar color de fondo</button></div></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-top:0">🧾 Datos de la factura</h3><div class="cc">${ti('nit','NIT')}${ti('dir','Dirección')}${ti('tel','Teléfono')}${ti('foot','Mensaje al pie','¡Gracias por su visita!')}</div><div class="row"><label><input type="checkbox" ${c.showTax?'checked':''} onchange="cf('showTax',this.checked)" style="width:auto;min-height:0"> Mostrar impuestos discriminados en la factura</label></div><p class="k">Por defecto el consumidor solo ve el total. Este comprobante es interno y no reemplaza la factura electrónica DIAN.</p></div>`}

function toggleMenu(){const a=document.querySelector('aside'),b=document.getElementById('menuToggle'),open=!a.classList.contains('menu-open');a.classList.toggle('menu-open',open);if(b)b.setAttribute('aria-expanded',String(open))}
function closeMenu(){const a=document.querySelector('aside'),b=document.getElementById('menuToggle');a.classList.remove('menu-open');if(b)b.setAttribute('aria-expanded','false')}
function render(){const nv=document.getElementById('nav'),ap=document.querySelector('aside'),c=S.cfg;ap.style.display=role?'':'none';document.querySelector('.app').style.gridTemplateColumns=role?'':'1fr';
 document.querySelector('.logo').innerHTML=(c.logo?`<img class="lgi" src="${c.logo}" alt="">`:'')+esc(c.app);
 if(!role){const n=note?`<div class="msg ${note.e?'e':''}">${esc(note.t)}</div>`:'';nv.innerHTML='';document.getElementById('m').innerHTML=n+loginUI();note=null;return}
 const T=role==='owner'?TO:TM,ids=T.map(t=>t[0]);if(!ids.includes(tab))tab=ids[0];
 nv.innerHTML=T.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="closeMenu();go2('${k}')">${l}</button>`).join('');
 const bz=S.biz.find(x=>x.id===S.a),top=`<div class="top">${role==='owner'?`<select aria-label="Negocio activo" onchange="S.a=this.value;cart=[];mesa='';tk=null;save();render()">${S.biz.map(x=>`<option value="${x.id}" ${x.id===S.a?'selected':''}>${esc(x.name)} · ${esc(x.type)}</option>`).join('')}</select><button class="b g" onclick="go2('neg')">⚙ Negocios</button>`:`<b style="font-size:1.15rem">🏪 ${esc(bz.name)}</b>`}<span class="chipx" style="margin-left:auto">${role==='owner'?'👑 Dueño':'🍽️ '+esc(who)}</span><button class="b g" onclick="logout()">Salir</button></div>`;
 const n=note?`<div class="msg ${note.e?'e':''}">${esc(note.t)}</div>`:'';
 const tp=tk&&tab==='pos'?`<div class="card"><div class="row"><b>🧾 Factura #${tk.n}</b><select aria-label="Ancho de papel" onchange="pw=+this.value;render()"><option value="80" ${pw===80?'selected':''}>Térmica 80 mm</option><option value="58" ${pw===58?'selected':''}>Térmica 58 mm</option></select><button class="b" onclick="ask=tk;render()">🖨 ${(tk.log||[]).length?'Volver a imprimir':'Imprimir factura'}</button><button class="b g" onclick="tk=null;render()">Cerrar</button></div><div class="prev">${ticket(tk,0)}</div></div>`:'';
 const md=ask?`<div class="ov"><div class="mo" role="dialog" aria-modal="true" aria-label="Confirmar impresión"><h3 style="margin-top:0">🖨️ ¿Imprimir factura?</h3><p>Venta #${ask.n} · <b>${fmt(ask.total)}</b><br>Se imprimirán el original y la copia de control interno.</p>${(ask.log||[]).length?'<p class="neg"><b>Es una reimpresión y quedará registrada.</b></p>':''}<div class="row"><button class="b big" onclick="printTk()">Sí, imprimir</button><button class="b g big" onclick="ask=null;render()">Ahora no</button></div></div></div>`:'';
 const M={dash,pos,mesas,sales,inv,exp,cash,debt,tax,neg,rep,sec,cfg};
 document.getElementById('m').innerHTML=top+n+tp+(role==='owner'?M[tab]():(tab==='inv'?invRO():tab==='mesas'?mesas():pos()))+md;note=null}
